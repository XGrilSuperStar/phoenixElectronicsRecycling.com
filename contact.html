<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &mdash; Phoenix Electronics Recycling</title>
<meta name="description" content="1816 Duke St, Redlands CA 92374. Call 951.771.7388 or email blu.ewasteaz@gmail.com.">
<style>
/* Phoenix Electronics Recycling */

:root{
  --green:#1e7d32;
  --green-dark:#14532a;
  --ink:#333333;
  --ink-soft:#5b6660;
  --line:#e2e6e3;
  --maxw:1120px;
}

*{box-sizing:border-box}
body{
  margin:0;
  color:var(--ink);
  background:#fff;
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  font-size:16px;
  line-height:1.6;
}
img{max-width:100%;display:block}
a{color:var(--green)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---------- hero ---------- */
.hero{position:relative;min-height:600px;display:flex;flex-direction:column;overflow:hidden}
.hero-slides,.hero-tint{position:absolute;inset:0}
.slide{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  opacity:0;animation:fade 18s infinite;
}
.s1{background-image:none;animation-delay:0s}
.s2{background-image:none;animation-delay:6s}
.s3{background-image:none;animation-delay:12s}
@keyframes fade{
  0%{opacity:0} 4%{opacity:1} 30%{opacity:1} 36%{opacity:0} 100%{opacity:0}
}
.hero-tint{background:linear-gradient(180deg,rgba(20,83,42,.72),rgba(20,83,42,.55))}

.hero-bar{
  position:relative;z-index:3;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;padding:22px 40px 0;
}
.logo img{width:200px;height:auto}
.nav{display:flex;align-items:center;gap:30px;padding-top:16px}
.nav a{
  color:#fff;text-decoration:none;font-size:.95rem;
  padding-bottom:4px;border-bottom:2px solid transparent;
}
.nav a:hover{border-bottom-color:rgba(255,255,255,.6)}
.nav a.active{border-bottom-color:#fff}
.menu-btn{
  display:none;background:none;border:0;color:#fff;
  padding:8px;cursor:pointer;
}

.hero-copy{
  position:relative;z-index:3;flex:1;
  display:flex;align-items:center;justify-content:flex-end;
  padding:20px 40px 70px;
}
.hero-text{
  max-width:560px;text-align:right;color:#fff;
  border-right:2px solid rgba(255,255,255,.65);
  padding-right:28px;
}
.hero-text h1{
  font-size:clamp(1.5rem,3vw,2rem);
  font-weight:700;letter-spacing:.01em;margin:0 0 14px;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.hero-text p{
  font-size:1.02rem;font-weight:600;margin:0 0 10px;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.hero-call{font-weight:400;font-size:1rem;margin-top:16px}
.hero-call a{color:#fff;text-decoration:none}

.hero-dots{
  position:absolute;bottom:22px;left:0;right:0;z-index:3;
  display:flex;justify-content:center;gap:12px;
}
.hero-dots span{
  width:10px;height:10px;border-radius:50%;
  border:1px solid rgba(255,255,255,.9);
}
.hero-dots span:first-child{background:#fff}

/* ---------- three cards ---------- */
.cards{padding:64px 0 20px}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.card{text-align:center}
.circle{
  width:265px;height:265px;margin:0 auto 26px;
  border-radius:50%;overflow:hidden;
}
.circle img{width:100%;height:100%;object-fit:cover}
.card h2{
  font-size:1.28rem;font-weight:400;color:#222;
  margin:0 0 22px;line-height:1.35;
}
.card p{font-size:.93rem;color:#4a4a4a;margin:0 0 14px}
.card ul{text-align:left;font-size:.9rem;color:#4a4a4a;margin:0;padding-left:20px}
.card li{margin-bottom:10px}
.lead-bold{font-weight:700;color:#222}

.btn{
  display:inline-block;margin-top:8px;
  background:#2f2f2f;color:#fff;text-decoration:none;
  font-size:.9rem;padding:12px 26px;
}
.btn:hover{background:#000;color:#fff}
.btn-light{background:#fff;color:var(--green-dark);white-space:nowrap}
.btn-light:hover{background:#f0f0f0;color:var(--green-dark)}

/* ---------- green strip ---------- */
.strip{background:var(--green);color:#fff;margin-top:56px;padding:44px 0}
.strip-inner{display:flex;align-items:center;justify-content:space-between;gap:30px}
.strip h3{margin:0 0 6px;font-size:1.3rem;font-weight:600}
.strip p{margin:0;font-size:.95rem;opacity:.92;max-width:60ch}

/* ---------- footer ---------- */
.foot{background:#1b1f1d;color:#c8d0cb;padding:48px 0 0;font-size:.9rem}
.foot-inner{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:36px;padding-bottom:36px}
.foot-logo{width:180px}
.foot h4{color:#fff;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px}
.foot p{margin:0}
.foot a{color:#c8d0cb;text-decoration:none}
.foot a:hover{color:#fff}
.foot-bar{border-top:1px solid #2c332f;padding:18px 24px;text-align:center;font-size:.78rem;color:#8b948f}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .hero{min-height:520px}
  .hero-bar{padding:16px 20px 0;align-items:center}
  .logo img{width:120px}
  .menu-btn{display:block}
  .hero-bar{position:relative;z-index:30}
  .nav{
    position:absolute;top:100%;left:0;right:0;
    flex-direction:column;align-items:stretch;gap:0;padding:0;
    background:#123f21;
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .nav.open{max-height:320px}
  .nav a{padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.14)}
  .hero-copy{justify-content:flex-start;padding:30px 22px 70px}
  .hero-text{text-align:left;border-right:0;border-left:2px solid rgba(255,255,255,.65);
             padding-right:0;padding-left:18px}
  .card-grid{grid-template-columns:1fr;gap:52px}
  .strip-inner{flex-direction:column;align-items:flex-start}
  .foot-inner{grid-template-columns:1fr 1fr;gap:28px}
}
@media (max-width:520px){
  .circle{width:230px;height:230px}
  .foot-inner{grid-template-columns:1fr}
}

/* ---------- interior pages ---------- */
.topbar{background:var(--green);position:relative;z-index:30}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;max-width:var(--maxw);margin:0 auto;padding:14px 22px;
}
.topbar .logo img{width:auto;height:86px}
.topbar .nav{padding-top:0}
.topbar .menu-btn{color:#fff}

.page{padding:44px 0 10px}
.page-head{
  font-size:1.35rem;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:#222;margin:0 0 14px;
}
.page-rule{border:0;border-top:1px solid var(--line);margin:0 0 42px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;margin-bottom:56px}
.split.flip .split-img{order:2}
.split-img img{width:100%;height:auto}
.split h3{font-size:1.25rem;font-weight:500;color:#222;margin:0 0 16px}
.split p{font-size:.95rem;color:#4a4a4a;margin:0 0 12px}

.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:60px;margin-bottom:40px}
.accept-item{margin-bottom:26px}
.accept-item h3{font-size:1.08rem;font-weight:500;color:#1a1a1a;margin:0 0 4px}
.accept-item p{margin:0;font-size:.94rem;color:#4a4a4a}
.note{font-weight:700;color:#1a1a1a}
.side h3{font-size:1.12rem;font-weight:500;color:#222;margin:0 0 18px}
.side p{font-size:.94rem;color:#4a4a4a;margin:0 0 12px}

.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;margin-bottom:48px}
.svc{border:1px solid var(--line);padding:28px}
.svc h3{margin:0 0 10px;font-size:1.08rem;font-weight:600;color:#1a1a1a}
.svc p{margin:0;font-size:.94rem;color:#4a4a4a}
.svc ul{margin:10px 0 0;padding-left:20px;font-size:.94rem;color:#4a4a4a}
.svc li{margin-bottom:6px}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-bottom:48px}
.contact-grid h3{font-size:1.15rem;font-weight:500;color:#222;margin:0 0 18px}
.field{width:100%;border:1px solid #c9cfcb;padding:14px 14px;font:inherit;font-size:.95rem;margin-bottom:16px;background:#fff;color:var(--ink)}
textarea.field{min-height:150px;resize:vertical}
.btn-send{width:100%;border:1px solid #c9cfcb;background:#fff;font:inherit;font-size:.95rem;padding:14px;cursor:pointer}
.btn-send:hover{background:#f2f4f3}
.biz-name{font-size:1.1rem;color:#222;margin:0 0 10px}
.hours-tbl{font-size:.94rem;color:#4a4a4a}
.hours-tbl td{padding:2px 22px 2px 0}
.visit-note{border:1px solid var(--green);padding:10px 12px;font-size:.92rem;color:#4a4a4a;margin:0 0 22px}

@media (max-width:900px){
  .topbar-inner{padding:12px 20px;position:relative}
  .topbar .logo img{height:44px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <a href="index.html"><img src="logo.png" alt="Phoenix Electronics Recycling"></a>
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="what-we-take.html">What We Take</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<main class="page wrap">
  <h1 class="page-head">Contact Us</h1>
  <hr class="page-rule">

  <div class="contact-grid">
    <div class="contact-form">
      <h3>Drop us a line!</h3>
      <form action="#" method="POST">

        <textarea class="field" placeholder="Message" required></textarea>
        <button type="submit" class="btn-send">Send</button>
      </form>

      <h3>Better yet, see us in person!</h3>
      <p class="visit-note">We love our customers, so feel free to visit during normal business hours.</p>
      
      <div class="split-img" style="margin-bottom: 24px;">
        <!-- New visual element: E-waste bin with computer components -->
        <img src="ewaste-bin.png" alt="Yellow electronics recycling collection bin filled with green circuit boards and computer hard drives">
      </div>

      <div class="biz-name"><strong>Phoenix Electronics Recycling</strong></div>
      <p style="margin: 0 0 10px; font-size: .95rem; color: #4a4a4a;">
